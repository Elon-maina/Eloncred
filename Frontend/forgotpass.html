<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h2>Forgot Password</h2>

    <!-- Step 1: Enter email and request verification code -->
    <form id="forgot-password-form">
        <input type="email" id="email" placeholder="Enter your email" required><br>
        <button type="submit">Send Verification Code</button>
    </form>

    <!-- Step 2: Enter the verification code (Hidden initially) -->
    <div id="code-section" style="display: none;">
        <h3>Enter Verification Code</h3>
        <p>A verification code has been sent to your email.</p>
        <form id="verify-code-form">
            <input type="text" id="verification-code" placeholder="Enter code" required><br>
            <button type="submit">Verify Code</button>
            <button type="button" id="resend-code" disabled>Resend Code (30s)</button>
        </form>
    </div>

    <p><a href="login.html">Back to Login</a></p>

    <script>
        let storedEmail = ""; // Global variable to store email
        let resendButton = document.getElementById("resend-code");
        let resendTimer = 30;

        document.getElementById("forgot-password-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            storedEmail = email; // Store the email for later use

            const response = await fetch("http://localhost:5000/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });

            const result = await response.json();

            if (!response.ok) {
                Swal.fire("Error", result.error || "Invalid email or user does not exist!", "error");
                return;
            }

            Swal.fire("Success", "Verification code has been sent to your email!", "success");
            document.getElementById("code-section").style.display = "block";
            document.getElementById("forgot-password-form").style.display = "none";
            startResendTimer();
        });

        document.getElementById("verify-code-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const code = document.getElementById("verification-code").value;

            if (!storedEmail) {
                Swal.fire({
                    icon: "error",
                    title: "Error",
                    text: "Email not found. Please request a verification code again."
                });
                return;
            }

            const response = await fetch("http://localhost:5000/auth/verify-reset-code", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: storedEmail, code })
            });

            const result = await response.json();

            Swal.fire({
                icon: response.ok ? "success" : "error",
                title: response.ok ? "Success" : "Error",
                text: result.message || result.error
            }).then(() => {
                if (response.ok) {
                    window.location.href = `reset-password.html?email=${encodeURIComponent(storedEmail)}&code=${encodeURIComponent(result.otp)}`;
                }
            });
        });

        resendButton.addEventListener("click", async () => {
            if (!storedEmail) {
                Swal.fire("Error", "Please enter your email first.", "error");
                return;
            }

            resendButton.disabled = true; // Disable button immediately to prevent multiple clicks
            resendButton.innerText = "Resending...";

            const response = await fetch("http://localhost:5000/auth/resend-code", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: storedEmail })
            });

            const result = await response.json();

            if (!response.ok) {
                Swal.fire("Error", result.error || "Failed to resend code.", "error");
                resendButton.disabled = false;
                resendButton.innerText = "Resend Code";
                return;
            }

            Swal.fire("Success", "A new verification code has been sent!", "success");
            startResendTimer();
        });

        function startResendTimer() {
            resendButton.disabled = true;
            resendTimer = 30;
            resendButton.innerText = `Resend Code (${resendTimer}s)`;

            let interval = setInterval(() => {
                resendTimer--;
                resendButton.innerText = `Resend Code (${resendTimer}s)`;

                if (resendTimer <= 0) {
                    clearInterval(interval);
                    resendButton.disabled = false;
                    resendButton.innerText = "Resend Code";
                }
            }, 1000);
        }
    </script>
    <script src="scriptx.js"></script>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .container {
        text-align: center;
    }
    form {
        background: #cfb5b5;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 10px 10px 15px rgba(0, 0, 0, 0.2);
        width: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    h2, h3 {
        margin-bottom: 10px;
        font-size: 26px;
        color: #000000;
        text-align: center;
    }
    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: none;
        border-radius: 5px;
        background: #f8f7f7;
        color: #000000;
        outline: none;
    }
    button {
        width: 100%;
        padding: 10px;
        margin: 3px;
        background: #9e039e;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        color: #000;
        cursor: pointer;
        transition: 0.3s;
    }
    button:disabled {
        background: #ccc;
        cursor: not-allowed;
    }
    button:hover:not(:disabled) {
        background: #9370DB;
    }
    p {
        margin-top: 20px;
        font-size: 14px;
        text-align: center;
        color: #000;
    }
    a {
        color: #0400ff;
        text-decoration: none;
    }
    a:hover {
        text-decoration: underline;
    }
    </style>
</body>
</html>
