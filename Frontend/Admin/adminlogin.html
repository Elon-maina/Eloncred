<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eloncred Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #eef3f8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MAIN CARD */
        .login-container {
            width: 100%;
            max-width: 1100px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            display: flex;
            overflow: hidden;
        }

        /* LEFT SIDE */
        .login-left {
            width: 45%;
            padding: 50px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo {
            width: 90px;
        }

        .logo-title {
            font-size: 24px;
            font-weight: 700;
            color: #1f4d7a;
            margin-left: 0;
        }

        .admin-top {
            font-size: 13px;
            color: #fff;
            background: #1f4d7a;
            padding: 6px 10px;
            border-radius: 8px;
            margin-left: auto;
        }

        .login-left label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #444;
        }

        .login-left input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #dcdcdc;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .login-left input:focus {
            outline: none;
            border-color: #1f4d7a;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #1f4d7a;
            border: none;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-login:hover {
            background: #163a5c;
        }

        .forgot {
            margin-top: 18px;
            font-size: 13px;
            text-align: center;
        }

        .forgot a {
            color: #1f4d7a;
            text-decoration: none;
            font-weight: 500;
        }

        /* RIGHT SIDE */
        .login-right {
            width: 55%;
            background: linear-gradient(
                rgba(15, 52, 96, 0.75),
                rgba(15, 52, 96, 0.75)
            ),
            url("shop.jpg") center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 40px;
        }

        .welcome-box h1 {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .welcome-box p {
            font-size: 15px;
            opacity: 0.9;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .login-container {
                flex-direction: column;
            }

            .login-left,
            .login-right {
                width: 100%;
            }

            .login-right {
                min-height: 280px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">

        <!-- LEFT LOGIN FORM -->
        <div class="login-left">

            <div class="logo-box">
                <img src="../images/ElonCredi.png" alt="Eloncred Logo" class="logo">
                <span class="logo-title">Eloncred Admin</span>
                <span class="admin-top">Top Admin Login</span>
            </div>

            <form method="POST" action="/api/admin/login">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your Email here" required>

                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your Password" required>

                <button class="btn-login">Log in</button>

                <div class="forgot">
                    Forgotten your login details?
                    <a href="#">Get Help signing in</a>
                </div>
            </form>

        </div>

        <!-- RIGHT WELCOME PANEL -->
        <div class="login-right">
            <div class="welcome-box">
                <h1>Welcome Eloncred<br>Admin</h1>
                <p>Log in to access Dashboard</p>
            </div>
        </div>

    </div>

</body>
    <script>
    document.addEventListener('DOMContentLoaded', function(){
        const form = document.querySelector('form');
        form.addEventListener('submit', async function(e){
            e.preventDefault();
            const email = form.querySelector('input[name="email"]').value;
            const password = form.querySelector('input[name="password"]').value;
            try {
                const resp = await fetch('http://localhost:3000/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await resp.json();
                if (data && data.success) {
                    // rely on server-side session cookie (do NOT store token in localStorage)
                    window.location.href = '../Admin/Admndash.html';
                } else {
                    alert(data.message || 'Admin login failed');
                }
            } catch (err) {
                console.error('Admin login error', err);
                alert('Admin login failed');
            }
        });
    });
    </script>
</html>
